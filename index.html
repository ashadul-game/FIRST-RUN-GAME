<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chase & Run Game</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #1a1a1a;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      touch-action: manipulation;
    }
    h2 { margin: 5px 0; }
    canvas {
      border: 2px solid #fff;
      background-color: #222;
      max-width: 90vw;
    }
    .controls-container {
      margin-top: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .btn-row {
      display: flex;
      gap: 15px;
    }
    .btn {
      width: 55px;
      height: 55px;
      background-color: #444;
      color: white;
      font-size: 20px;
      font-weight: bold;
      border: 2px solid #666;
      border-radius: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      user-select: none;
    }
    .btn:active {
      background-color: #00ff88;
      color: black;
    }
    #restartBtn {
      margin-top: 10px;
      padding: 8px 16px;
      background: #ff4444;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 14px;
      display: none;
    }
  </style>
</head>
<body>

  <h2>Run & Chase Game</h2>
  <canvas id="gameCanvas" width="320" height="320"></canvas>
  <button id="restartBtn" onclick="resetGame()">আবার খেলুন (Restart)</button>

  <!-- মোবাইল কন্ট্রোল বাটন -->
  <div class="controls-container">
    <div class="btn" id="btnUp">▲</div>
    <div class="btn-row">
      <div class="btn" id="btnLeft">◄</div>
      <div class="btn" id="btnDown">▼</div>
      <div class="btn" id="btnRight">►</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const restartBtn = document.getElementById("restartBtn");

    let runner, chaser, gameOver, score;

    function resetGame() {
      runner = { x: 50, y: 50, size: 16, speed: 3.5, dx: 0, dy: 0 };
      chaser = { x: 250, y: 250, size: 16, speed: 1.8 };
      gameOver = false;
      score = 0;
      restartBtn.style.display = "none";
      gameLoop();
    }

    // বাটন প্রেস হ্যান্ডলার
    function setDirection(dx, dy) {
      if (!gameOver) {
        runner.dx = dx * runner.speed;
        runner.dy = dy * runner.speed;
      }
    }

    function stopMovement() {
      runner.dx = 0;
      runner.dy = 0;
    }

    // অন-স্ক্রিন বাটনে টাচ ইভেন্ট
    const bindBtn = (id, dx, dy) => {
      const btn = document.getElementById(id);
      btn.addEventListener("touchstart", (e) => { e.preventDefault(); setDirection(dx, dy); });
      btn.addEventListener("touchend", (e) => { e.preventDefault(); stopMovement(); });
      btn.addEventListener("mousedown", () => setDirection(dx, dy));
      btn.addEventListener("mouseup", stopMovement);
    };

    bindBtn("btnUp", 0, -1);
    bindBtn("btnDown", 0, 1);
    bindBtn("btnLeft", -1, 0);
    bindBtn("btnRight", 1, 0);

    function update() {
      if (gameOver) return;

      runner.x += runner.dx;
      runner.y += runner.dy;

      runner.x = Math.max(0, Math.min(canvas.width - runner.size, runner.x));
      runner.y = Math.max(0, Math.min(canvas.height - runner.size, runner.y));

      // লাল বক্সটির তাড়া করা
      if (chaser.x < runner.x) chaser.x += chaser.speed;
      if (chaser.x > runner.x) chaser.x -= chaser.speed;
      if (chaser.y < runner.y) chaser.y += chaser.speed;
      if (chaser.y > runner.y) chaser.y -= chaser.speed;

      // ধরা পড়ার লজিক
      const distX = runner.x - chaser.x;
      const distY = runner.y - chaser.y;
      const distance = Math.sqrt(distX * distX + distY * distY);

      if (distance < runner.size - 2) {
        gameOver = true;
        restartBtn.style.display = "block";
      } else {
        score++;
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // সবুজ রানার
      ctx.fillStyle = "#00ff88";
      ctx.fillRect(runner.x, runner.y, runner.size, runner.size);

      // লাল চেজার
      ctx.fillStyle = "#ff4444";
      ctx.fillRect(chaser.x, chaser.y, chaser.size, chaser.size);

      // স্কোর
      ctx.fillStyle = "#ffffff";
      ctx.font = "14px Arial";
      ctx.fillText("Score: " + Math.floor(score / 10), 10, 20);

      if (gameOver) {
        ctx.fillStyle = "#ff4444";
        ctx.font = "24px Arial";
        ctx.fillText("Game Over!", 100, 150);
      }
    }

    function gameLoop() {
      update();
      draw();
      if (!gameOver) {
        requestAnimationFrame(gameLoop);
      }
    }

    resetGame();
  </script>
</body>
</html>
