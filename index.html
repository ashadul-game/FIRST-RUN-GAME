<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chase & Run Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            touch-action: manipulation;
        }
        h2 { margin: 5px 0; }
        canvas {
            border: 2px solid #fff;
            background-color: #222;
            max-width: 90vw;
            max-height: 70vh;
            display: block;
        }
        #controls {
            margin-top: 10px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 90%;
            max-width: 300px;
        }
        .btn {
            background: #444;
            color: white;
            border: 1px solid #fff;
            padding: 15px;
            font-size: 18px;
            text-align: center;
            border-radius: 5px;
            user-select: none;
            -webkit-user-select: none;
        }
        .btn:active { background: #666; }
        #upBtn { grid-column: 2; }
        #leftBtn { grid-column: 1; grid-row: 2; }
        #downBtn { grid-column: 2; grid-row: 2; }
        #rightBtn { grid-column: 3; grid-row: 2; }
    </style>
</head>
<body>
    <h2>ধরা-ধরি খেলা</h2>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    
    <div id="controls">
        <div class="btn" id="upBtn">⬆️</div>
        <div class="btn" id="leftBtn">⬅️</div>
        <div class="btn" id="downBtn">⬇️</div>
        <div class="btn" id="rightBtn">➡️</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // ছেলে প্লেয়ার আঁকার ফাংশন
        function drawBoy(x, y, size) {
            // মাথার ওপর "You" লেখা
            ctx.fillStyle = "#00FFCC";
            ctx.font = "bold 12px Arial";
            ctx.textAlign = "center";
            ctx.fillText("You", x + size/2, y - 5);

            // মাথা
            ctx.fillStyle = "#FFD700";
            ctx.beginPath();
            ctx.arc(x + size/2, y + size/3, size/3, 0, Math.PI * 2);
            ctx.fill();

            // চুল
            ctx.fillStyle = "black";
            ctx.fillRect(x + size/4, y + size/10, size/2, size/5);

            // শরীর
            ctx.fillStyle = "blue";
            ctx.fillRect(x + size/4, y + size/2, size/2, size/2);

            // চোখ
            ctx.fillStyle = "black";
            ctx.fillRect(x + size/3, y + size/4, size/10, size/10);
            ctx.fillRect(x + size*2/3, y + size/4, size/10, size/10);
        }

        // মেয়ে প্লেয়ার আঁকার ফাংশন
        function drawGirl(x, y, size) {
            // মাথার ওপর "Your Ex" লেখা
            ctx.fillStyle = "#FF4D4D";
            ctx.font = "bold 12px Arial";
            ctx.textAlign = "center";
            ctx.fillText("Your Ex", x + size/2, y - 5);

            // মাথা
            ctx.fillStyle = "#FFC0CB";
            ctx.beginPath();
            ctx.arc(x + size/2, y + size/3, size/3, 0, Math.PI * 2);
            ctx.fill();

            // লম্বা চুল
            ctx.fillStyle = "brown";
            ctx.fillRect(x, y, size/4, size);
            ctx.fillRect(x + size*3/4, y, size/4, size);

            // জামা
            ctx.fillStyle = "red";
            ctx.beginPath();
            ctx.moveTo(x + size/2, y + size/2);
            ctx.lineTo(x, y + size);
            ctx.lineTo(x + size, y + size);
            ctx.fill();

            // চোখ
            ctx.fillStyle = "black";
            ctx.fillRect(x + size/3, y + size/4, size/10, size/10);
            ctx.fillRect(x + size*2/3, y + size/4, size/10, size/10);
        }

        let player = {
            x: 50,
            y: 50,
            size: 20,
            speed: 5,
            draw: function() { drawBoy(this.x, this.y, this.size); }
        };

        let enemy = {
            x: 300,
            y: 300,
            size: 20,
            speed: 2,
            draw: function() { drawGirl(this.x, this.y, this.size); }
        };

        let keys = {};
        let gameOver = false;

        window.addEventListener('keydown', e => keys[e.key] = true);
        window.addEventListener('keyup', e => keys[e.key] = false);

        function setupTouchBtn(id, key) {
            const btn = document.getElementById(id);
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
        }

        setupTouchBtn('upBtn', 'ArrowUp');
        setupTouchBtn('downBtn', 'ArrowDown');
        setupTouchBtn('leftBtn', 'ArrowLeft');
        setupTouchBtn('rightBtn', 'ArrowRight');

        function movePlayer() {
            if (keys['ArrowUp'] && player.y > 15) player.y -= player.speed;
            if (keys['ArrowDown'] && player.y < canvas.height - player.size) player.y += player.speed;
            if (keys['ArrowLeft'] && player.x > 0) player.x -= player.speed;
            if (keys['ArrowRight'] && player.x < canvas.width - player.size) player.x += player.speed;
        }

        function moveEnemy() {
            if (enemy.x < player.x) enemy.x += enemy.speed;
            if (enemy.x > player.x) enemy.x -= enemy.speed;
            if (enemy.y < player.y) enemy.y += enemy.speed;
            if (enemy.y > player.y) enemy.y -= enemy.speed;
        }

        function checkCollision() {
            if (player.x < enemy.x + enemy.size &&
                player.x + player.size > enemy.x &&
                player.y < enemy.y + enemy.size &&
                player.y + player.size > enemy.y) {
                gameOver = true;
            }
        }

        function gameLoop() {
            if (gameOver) {
                ctx.fillStyle = "white";
                ctx.font = "26px Arial";
                ctx.textAlign = "center";
                ctx.fillText("Your Ex Caught You!", canvas.width / 2, canvas.height / 2);
                return;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            movePlayer();
            moveEnemy();
            checkCollision();
            
            player.draw();
            enemy.draw();
            
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
