<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chase & Run Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            touch-action: manipulation;
        }
        h2 { margin: 5px 0; }
        #scoreBoard {
            font-size: 18px;
            margin-bottom: 5px;
            color: #00FFCC;
            font-weight: bold;
        }
        canvas {
            border: 2px solid #fff;
            background-color: #222;
            max-width: 90vw;
            max-height: 60vh;
            display: block;
        }
        #restartBtn {
            display: none;
            margin-top: 10px;
            padding: 10px 20px;
            font-size: 16px;
            background-color: #FF4D4D;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        #restartBtn:active { background-color: #cc0000; }
        #controls {
            margin-top: 10px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 90%;
            max-width: 300px;
        }
        .btn {
            background: #444;
            color: white;
            border: 1px solid #fff;
            padding: 15px;
            font-size: 18px;
            text-align: center;
            border-radius: 5px;
            user-select: none;
            -webkit-user-select: none;
        }
        .btn:active { background: #666; }
        #upBtn { grid-column: 2; }
        #leftBtn { grid-column: 1; grid-row: 2; }
        #downBtn { grid-column: 2; grid-row: 2; }
        #rightBtn { grid-column: 3; grid-row: 2; }
    </style>
</head>
<body>
    <h2>ধরা-ধরি খেলা</h2>
    <div id="scoreBoard">স্কোর: <span id="score">0</span></div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <button id="restartBtn" onclick="resetGame()">আবার শুরু করুন</button>
    
    <div id="controls">
        <div class="btn" id="upBtn">⬆️</div>
        <div class="btn" id="leftBtn">⬅️</div>
        <div class="btn" id="downBtn">⬇️</div>
        <div class="btn" id="rightBtn">➡️</div>
    </div>

    <!-- ব্যাকগ্রাউন্ড মিউজিক এবং সাউন্ড ইফেক্ট -->
    <audio id="bgMusic" loop>
        <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73223.mp3?filename=retro-game-loop-108878.mp3" type="audio/mpeg">
    </audio>
    <audio id="overSound">
        <source src="https://cdn.pixabay.com/download/audio/2021/08/04/audio_c6ccf3232f.mp3?filename=game-over-arcade-6435.mp3" type="audio/mpeg">
    </audio>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const restartBtn = document.getElementById('restartBtn');
        const bgMusic = document.getElementById('bgMusic');
        const overSound = document.getElementById('overSound');

        let score = 0;
        let scoreInterval;
        let gameOver = false;
        let musicStarted = false;

        // যেকোনো বাটন চাপলে বা টাচ করলে মিউজিক চালু হবে (ব্রাউজার সিকিউরিটির জন্য)
        function startMusic() {
            if (!musicStarted) {
                bgMusic.play().catch(e => console.log("Audio play allowed on user click"));
                musicStarted = true;
            }
        }
        window.addEventListener('keydown', startMusic);
        window.addEventListener('touchstart', startMusic);

        // ছেলে প্লেয়ার (You)
        function drawBoy(x, y, size) {
            ctx.fillStyle = "#00FFCC";
            ctx.font = "bold 12px Arial";
            ctx.textAlign = "center";
            ctx.fillText("You", x + size/2, y - 5);

            ctx.fillStyle = "#FFD700";
            ctx.beginPath();
            ctx.arc(x + size/2, y + size/3, size/3, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "black";
            ctx.fillRect(x + size/4, y + size/10, size/2, size/5);

            ctx.fillStyle = "blue";
            ctx.fillRect(x + size/4, y + size/2, size/2, size/2);

            ctx.fillStyle = "black";
            ctx.fillRect(x + size/3, y + size/4, size/10, size/10);
            ctx.fillRect(x + size*2/3, y + size/4, size/10, size/10);
        }

        // মেয়ে প্লেয়ার (Your Ex)
        function drawGirl(x, y, size) {
            ctx.fillStyle = "#FF4D4D";
            ctx.font = "bold 12px Arial";
            ctx.textAlign = "center";
            ctx.fillText("Your Ex", x + size/2, y - 5);

            ctx.fillStyle = "#FFC0CB";
            ctx.beginPath();
            ctx.arc(x + size/2, y + size/3, size/3, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "brown";
            ctx.fillRect(x, y, size/4, size);
            ctx.fillRect(x + size*3/4, y, size/4, size);

            ctx.fillStyle = "red";
            ctx.beginPath();
            ctx.moveTo(x + size/2, y + size/2);
            ctx.lineTo(x, y + size);
            ctx.lineTo(x + size, y + size);
            ctx.fill();

            ctx.fillStyle = "black";
            ctx.fillRect(x + size/3, y + size/4, size/10, size/10);
            ctx.fillRect(x + size*2/3, y + size/4, size/10, size/10);
        }

        let player, enemy, keys;

        function initVars() {
            player = { x: 50, y: 50, size: 20, speed: 5, draw: function() { drawBoy(this.x, this.y, this.size); } };
            enemy = { x: 300, y: 300, size: 20, speed: 2, draw: function() { drawGirl(this.x, this.y, this.size); } };
            keys = {};
            score = 0;
            scoreElement.innerText = score;
            gameOver = false;
            restartBtn.style.display = "none";

            bgMusic.currentTime = 0;
            if(musicStarted) bgMusic.play();

            clearInterval(scoreInterval);
            scoreInterval = setInterval(() => {
                if (!gameOver) {
                    score += 10;
                    scoreElement.innerText = score;
                }
            }, 1000);
        }

        window.addEventListener('keydown', e => keys[e.key] = true);
        window.addEventListener('keyup', e => keys[e.key] = false);

        function setupTouchBtn(id, key) {
            const btn = document.getElementById(id);
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; startMusic(); });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
        }

        setupTouchBtn('upBtn', 'ArrowUp');
        setupTouchBtn('downBtn', 'ArrowDown');
        setupTouchBtn('leftBtn', 'ArrowLeft');
        setupTouchBtn('rightBtn', 'ArrowRight');

        function movePlayer() {
            if (keys['ArrowUp'] && player.y > 15) player.y -= player.speed;
            if (keys['ArrowDown'] && player.y < canvas.height - player.size) player.y += player.speed;
            if (keys['ArrowLeft'] && player.x > 0) player.x -= player.speed;
            if (keys['ArrowRight'] && player.x < canvas.width - player.size) player.x += player.speed;
        }

        function moveEnemy() {
            if (enemy.x < player.x) enemy.x += enemy.speed;
            if (enemy.x > player.x) enemy.x -= enemy.speed;
            if (enemy.y < player.y) enemy.y += enemy.speed;
            if (enemy.y > player.y) enemy.y -= enemy.speed;
        }

        function checkCollision() {
            if (player.x < enemy.x + enemy.size &&
                player.x + player.size > enemy.x &&
                player.y < enemy.y + enemy.size &&
                player.y + player.size > enemy.y) {
                gameOver = true;
                restartBtn.style.display = "block";
                
                // মিউজিক বন্ধ করে Game Over সাউন্ড বাজবে
                bgMusic.pause();
                overSound.play();
            }
        }

        function resetGame() {
            initVars();
            gameLoop();
        }

        function gameLoop() {
            if (gameOver) {
                ctx.fillStyle = "#FF4D4D";
                ctx.font = "bold 32px Arial";
                ctx.textAlign = "center";
                ctx.fillText("Finish", canvas.width / 2, canvas.height / 2 - 40);

                ctx.fillStyle = "white";
                ctx.font = "15px Arial";
                ctx.fillText("আবার হেরে গেলে তুমি তোমার EX er kache .. Chi..🤧", canvas.width / 2, canvas.height / 2 + 5);

                ctx.fillStyle = "#00FFCC";
                ctx.font = "bold 16px Arial";
                ctx.fillText("মোট স্কোর: " + score, canvas.width / 2, canvas.height / 2 + 40);
                return;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            movePlayer();
            moveEnemy();
            checkCollision();
            
            player.draw();
            enemy.draw();
            
            requestAnimationFrame(gameLoop);
        }

        initVars();
        gameLoop();
    </script>
</body>
</html>
